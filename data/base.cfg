# Базовый сценарий: умеренная нагрузка, адаптивное управление.
# Запуск из корня проекта: ./bin/crossroad -c data/base.cfg

strategy = adaptive
car_rate = 30 25 30 25          # вероятность прибытия машины за такт, % (С В Ю З)
ped_rate = 4                    # вероятность прибытия пешехода к каждому переходу, %
emergency_rate = 2              # доля экстренного транспорта среди машин, %
emergency_priority = 1          # 1 - пропускать экстренный транспорт вне очереди

queue_capacity = 10             # вместимость очереди (у полосы и у перехода)

min_green = 5                   # мин. длительность фазы
max_green = 20                  # макс. длительность фазы (в фиксированном цикле - длительность каждой фазы)
clearance = 3                   # переходный интервал (жёлтый + все красные)
starvation_limit = 90           # защита от "голодания": макс. ожидание до внеочередной фазы
cross_time = 2                  # время проезда перекрёстка / перехода улицы

# Полосы: разрешённые манёвры для подходов С В Ю З (L - налево, S - прямо, R - направо)
maneuvers = LSR LSR LSR LSR
# Матрица конфликтов
conflicts = data/conflicts-default.txt
# Фазы (имя и потоки: NS = север-прямо, EL = восток-налево, ped = пешеходы)
phase = A NS NR SS SR
phase = B NL SL
phase = C ES ER WS WR
phase = D EL WL
phase = P ped

duration = 300                  # период наблюдения, тактов
participants = 0                # 0 - не ограничивать число участников
seed = 2026
delay = 300                     # мс между тактами
log = crossroad.log
